---
# This playbook configures a Splunk instance to use a 3rd party SSL/TLS key pair.

- name: Apply prereqs to all nodes
  hosts: "{{ splunk_hosts | default('splunkhosts') }}"
  gather_facts: false
  roles:
    - prereqs

- name: Apply SSL/TLS cert to web UI port (default tcp/8000)
  hosts: "{{ splunk_hosts | default('splunkhosts') }}"
  roles:
    - tls-config
