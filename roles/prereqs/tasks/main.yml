---

- name: Install python3 if not already available (ansible prereq)
  ansible.builtin.raw: >-
    bash -c "test -e /usr/bin/python3 || test -e /usr/bin/python ||
    (apt -qqy update && apt install -qy python3) ||
    (apt -qqy update && apt install -qy python-minimal) ||
    (yum -y install python3) || (dnf -y install python3)"
  become: true
  # raw cannot report real change state, and this is a no-op on any distro
  # that already ships python3 - which is all currently supported targets.
  changed_when: false
  failed_when: false
