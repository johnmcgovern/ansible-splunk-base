---

- name: Create /home/{{ os_user }}/backups dir
  file:
    path: /home/{{ os_user }}/backups
    state: directory
    mode: '0755'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: yes

- name: Archive (tgz) {{ splunk_home }}/etc to /home/{{ os_user }}/backups
  archive:
    path: "{{ splunk_home }}/etc"
    dest: "/home/{{ os_user }}/backups/splunk-etc-{{ inventory_hostname }}-{{ ansible_date_time.date }}--{{ ansible_date_time.time | replace(':', '-') }}.tgz"
    format: gz
    mode: '0644'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: yes
