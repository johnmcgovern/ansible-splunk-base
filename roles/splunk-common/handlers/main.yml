---
# Shared handlers. Available to any role that lists splunk-common as a
# dependency in meta/main.yml.
#
# Notify "restart splunk" or "restart splunk uf" from a task whose change
# requires splunkd to pick up new configuration.

- name: Restart Splunk via systemd
  ansible.builtin.systemd_service:
    name: Splunkd
    state: restarted
  become: true
  listen: restart splunk
  when: install_method == "systemd"

- name: Restart Splunk via the splunk CLI (initd)
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk restart"
  become: true
  listen: restart splunk
  when: install_method == "initd"
  changed_when: true

- name: Restart the Splunk Universal Forwarder via systemd
  ansible.builtin.systemd_service:
    name: SplunkForwarder
    state: restarted
  become: true
  listen: restart splunk uf
  when: uf_install_method == "systemd"

- name: Restart the Splunk Universal Forwarder via the splunk CLI (initd)
  ansible.builtin.command: "{{ splunk_uf_home }}/bin/splunk restart"
  become: true
  listen: restart splunk uf
  when: uf_install_method == "initd"
  changed_when: true
