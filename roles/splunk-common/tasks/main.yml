---
# Intentionally empty.
#
# splunk-common is depended on by the other roles for its defaults, handlers,
# and argument validation - not to run tasks. Its actual task files are
# included explicitly by name:
#
#   resolve-version.yml    - derive version/filename/checksum from the URL
#   fetch-tgz.yml          - download or upload the installer
#   systemd-unit-fixes.yml - patch the generated Splunkd.service unit
#
# Keeping main.yml empty means roles that only need the shared variables
# (os-config, the backup roles) do not run a dozen skipped tasks.
