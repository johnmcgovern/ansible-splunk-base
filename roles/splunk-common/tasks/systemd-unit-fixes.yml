---
# Shared fixes applied to the unit file that "splunk enable boot-start"
# generates. Used by the core and Universal Forwarder install/upgrade roles.
#
# Callers pass:
#   unit_path - full path to the generated unit file. Defaults to the Splunk
#               Enterprise unit; the forwarder's is SplunkForwarder.service.
#
# Include only when the relevant install method is "systemd". Both
# replacements are no-ops once applied, so re-running is safe and reports no
# change. systemd is reloaded only if the unit actually changed.

- name: -systemd & Ubuntu- Fix {{ unit_path | default('/etc/systemd/system/Splunkd.service') }} for Ubuntu support
  ansible.builtin.replace:
    path: "{{ unit_path | default('/etc/systemd/system/Splunkd.service') }}"
    regexp: '\/init.scope'
    replace: ''
  become: true
  register: splunk_unit_init_scope_fix
  when: ansible_facts['distribution'] == "Ubuntu"

- name: -systemd & Ubuntu- Fix the cgroups path reference in the unit file (Ubuntu 22.04+)
  ansible.builtin.replace:
    path: "{{ unit_path | default('/etc/systemd/system/Splunkd.service') }}"
    regexp: '\/sys\/fs\/cgroup\/\w+'
    replace: '/sys/fs/cgroup'
  become: true
  register: splunk_unit_cgroup_fix
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - ansible_facts['distribution_major_version'] | int >= 22

- name: -systemd- Reload the systemd daemon units after a unit file change  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: splunk_unit_init_scope_fix is changed or splunk_unit_cgroup_fix is changed
