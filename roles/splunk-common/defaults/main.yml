---
# Defaults shared by every role in this project.
#
# splunk-common is listed as a dependency in each role's meta/main.yml, so
# these values are in scope everywhere. Override any of them in
# group_vars/all, host_vars, or on the command line with -e.
#
# Because these are role defaults, a group_vars/all written for an older
# release keeps working: anything it does not mention falls back to the
# value here rather than failing as an undefined variable.


# User and group that will run splunkd on the OS and own Splunk files
os_user: splunk
os_group: splunk

# $SPLUNK_HOME paths
splunk_home: /opt/splunk
splunk_uf_home: /opt/splunkforwarder
splunk_base_path: /opt

# Process management for Splunk Enterprise boot-start.
#   systemd - 7.2.2 or later required.
#   initd   - Supported on any version, but no Workload Management support.
install_method: systemd

# Process management for the Universal Forwarder. Separate from
# install_method so a forwarder and an indexer can differ.
#
# Defaults to systemd because that is what this project has actually been
# producing: earlier releases ran "enable boot-start -user <user>" with no
# -systemd-managed flag, and modern Splunk defaults that to systemd, so the
# tasks labelled "initd" have been creating SplunkForwarder.service for years.
# Set this to initd to get a real init script - that path now passes
# -systemd-managed 0 explicitly, as the Splunk Enterprise role always has.
uf_install_method: systemd

# Whether to download the tgz installer from Splunk (true), or upload it from
# the ./files/ directory of this project (false).
download_tgz_from_splunk_servers: true
download_uf_tgz_from_splunk_servers: true

# Full .tgz download URL from splunk.com. Version, filename, and sha512
# checksum are derived from it. Empty means fall back to the legacy
# splunk_version + splunk_tgz + splunk_tgz_checksum variables.
splunk_download_url: ""
splunk_uf_download_url: ""

# Optional pinned checksum, overriding the sha512 published by Splunk.
# Accepts "sha512:<hash>", "sha256:<hash>", or "md5:<hash>"; a bare hash is
# treated as md5 for backward compatibility.
splunk_tgz_checksum: ""
splunk_uf_tgz_checksum: ""
