---

- name: Resolve the Splunk download URL, version, and checksum
  ansible.builtin.include_role:
    name: splunk-common
    tasks_from: resolve-version

- name: Check for an existing Universal Forwarder install
  ansible.builtin.stat:
    path: "{{ splunk_uf_home }}/etc/splunk.version"
  register: splunk_uf_version_file_stat
  become: true

- name: Read the currently installed Universal Forwarder version
  ansible.builtin.slurp:
    src: "{{ splunk_uf_home }}/etc/splunk.version"
  register: splunk_uf_version_file
  become: true
  when: splunk_uf_version_file_stat.stat.exists

- name: Record the currently installed Universal Forwarder version
  ansible.builtin.set_fact:
    splunk_uf_installed_version: >-
      {{ (splunk_uf_version_file.content | b64decode | regex_search('VERSION=([0-9.]+)', '\1') | first)
         if splunk_uf_version_file_stat.stat.exists else 'none' }}

- name: Report that the Universal Forwarder is already at the target version
  ansible.builtin.debug:
    msg: "Splunk Universal Forwarder {{ splunk_uf_version }} is already installed at {{ splunk_uf_home }} - nothing to upgrade."
  when: splunk_uf_installed_version == splunk_uf_version


- name: Upgrade the Universal Forwarder from {{ splunk_uf_installed_version }} to {{ splunk_uf_version }}
  when: splunk_uf_installed_version != splunk_uf_version
  block:

    - name: Ensure {{ splunk_uf_home }} dir exists
      ansible.builtin.file:
        path: "{{ splunk_uf_home }}"
        state: directory
        mode: '0755'
        owner: "{{ os_user }}"
        group: "{{ os_group }}"
      become: true

    - name: -TGZ- Fetch the Splunk Universal Forwarder installer
      ansible.builtin.include_role:
        name: splunk-common
        tasks_from: fetch-tgz
      vars:
        splunk_fetch_tgz: "{{ splunk_uf_tgz }}"
        splunk_fetch_url: "{{ splunk_uf_tgz_url }}"
        splunk_fetch_checksum: "{{ splunk_uf_tgz_checksum_resolved | default('') }}"
        splunk_fetch_download: "{{ download_uf_tgz_from_splunk_servers }}"

    - name: -initd- Stop the UF
      ansible.builtin.command: "{{ splunk_uf_home }}/bin/splunk stop"
      become: true
      when:
        - uf_install_method == "initd"
        - splunk_uf_version_file_stat.stat.exists
      changed_when: true

    - name: -systemd- Stop the UF
      ansible.builtin.systemd_service:
        name: SplunkForwarder
        state: stopped
      become: true
      when:
        - uf_install_method == "systemd"
        - splunk_uf_version_file_stat.stat.exists

    - name: Extract {{ splunk_uf_tgz }} to {{ splunk_uf_home }} to upgrade
      ansible.builtin.unarchive:
        src: /home/{{ os_user }}/{{ splunk_uf_tgz }}
        dest: "{{ splunk_base_path }}"
        remote_src: true
        owner: "{{ os_user }}"
        group: "{{ os_group }}"
      become: true

    - name: Set {{ splunk_uf_home }} owner & group recursively
      ansible.builtin.file:
        path: "{{ splunk_uf_home }}"
        state: directory
        owner: "{{ os_user }}"
        group: "{{ os_group }}"
        recurse: true
      become: true

    # "enable boot-start" refuses to overwrite an existing unit file or init
    # script: "A systemd unit file already exists at path=... run 'splunk
    # disable boot-start' before running this command." The Splunk Enterprise
    # upgrade has always cleared it first; this does the same.
    - name: Remove the existing boot-start configuration before rebuilding it
      ansible.builtin.command: >-
        {{ splunk_uf_home }}/bin/splunk disable boot-start
        --no-prompt --answer-yes --accept-license
      become: true
      changed_when: true

    # -systemd-managed 0 is required to actually get an init script: without
    # it, modern Splunk generates a systemd unit instead.
    - name: -initd- Splunk enable boot-start
      ansible.builtin.command: >-
        {{ splunk_uf_home }}/bin/splunk enable boot-start -systemd-managed 0
        -user {{ os_user }} --no-prompt --answer-yes --accept-license
      become: true
      when: uf_install_method == "initd"
      changed_when: true

    - name: -systemd- Splunk enable boot-start
      ansible.builtin.command: >-
        {{ splunk_uf_home }}/bin/splunk enable boot-start -systemd-managed 1
        -user {{ os_user }} --no-prompt --answer-yes --accept-license
      become: true
      when: uf_install_method == "systemd"
      changed_when: true

    - name: -systemd- Apply SplunkForwarder.service fixes
      ansible.builtin.include_role:
        name: splunk-common
        tasks_from: systemd-unit-fixes
      vars:
        unit_path: /etc/systemd/system/SplunkForwarder.service
      when: uf_install_method == "systemd"

    - name: -initd- Start the Splunk Universal Forwarder post upgrade
      ansible.builtin.command: "{{ splunk_uf_home }}/bin/splunk start --no-prompt --answer-yes --accept-license"
      become: true
      when: uf_install_method == "initd"
      changed_when: true

    - name: -systemd- Start the Splunk Universal Forwarder post upgrade
      ansible.builtin.systemd_service:
        name: SplunkForwarder
        state: started
        enabled: true
      become: true
      when: uf_install_method == "systemd"

    - name: "Create symlink to splunk in /usr/local/bin"
      ansible.builtin.file:
        src: "{{ splunk_uf_home }}/bin/splunk"
        path: /usr/local/bin/splunk
        state: link
        owner: "{{ os_user }}"
        group: "{{ os_group }}"
      become: true


# Outside the version guard on purpose. An upgrade interrupted after the
# tarball is extracted leaves the forwarder stopped, and every later run would
# skip the block above because the installed version already matches - so the
# role has to converge on "running", not just "installed".
- name: -systemd- Ensure the Splunk Universal Forwarder is running
  ansible.builtin.systemd_service:
    name: SplunkForwarder
    state: started
    enabled: true
  become: true
  when: uf_install_method == "systemd"

- name: -initd- Check whether the Universal Forwarder is running
  ansible.builtin.command: "{{ splunk_uf_home }}/bin/splunk status"
  register: splunk_uf_final_status
  changed_when: false
  failed_when: false
  become: true
  when: uf_install_method == "initd"

- name: -initd- Ensure the Splunk Universal Forwarder is running
  ansible.builtin.command: "{{ splunk_uf_home }}/bin/splunk start --no-prompt --answer-yes --accept-license"
  become: true
  when:
    - uf_install_method == "initd"
    - "'is running' not in splunk_uf_final_status.stdout | default('')"
  changed_when: true
