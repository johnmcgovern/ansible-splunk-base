---

- name: Add "{{ os_group }}" group
  ansible.builtin.group:
    name: "{{ os_group }}"
    state: present
  become: true

- name: Add "{{ os_user }}" user with the home dir /home/{{ os_user }}/
  ansible.builtin.user:
    name: "{{ os_user }}"
    group: "{{ os_group }}"
    home: /home/{{ os_user }}/
    shell: /bin/bash
    comment: Splunk User
  become: true

- name: Create {{ splunk_home }} dir
  ansible.builtin.file:
    path: "{{ splunk_home }}"
    state: directory
    mode: '0755'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: true


- name: -TGZ- Fetch the Splunk installer
  ansible.builtin.include_role:
    name: splunk-common
    tasks_from: fetch-tgz
  vars:
    splunk_fetch_tgz: "{{ splunk_tgz }}"
    splunk_fetch_url: "{{ splunk_tgz_url }}"
    splunk_fetch_checksum: "{{ splunk_tgz_checksum_resolved | default('') }}"
    splunk_fetch_download: "{{ download_tgz_from_splunk_servers }}"

# "creates" keeps us non-destructive: an existing install is never extracted
# over, and re-running install.yml against an installed host is a no-op.
- name: -TGZ- Extract {{ splunk_tgz }} to {{ splunk_home }} to install
  ansible.builtin.unarchive:
    src: /home/{{ os_user }}/{{ splunk_tgz }}
    dest: "{{ splunk_base_path }}"
    remote_src: true
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    creates: "{{ splunk_home }}/bin/splunk"
  register: splunk_extracted
  become: true

- name: "Create symlink to splunk in /usr/local/bin"
  ansible.builtin.file:
    src: "{{ splunk_home }}/bin/splunk"
    path: /usr/local/bin/splunk
    state: link
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: true


# Splunk consumes and deletes user-seed.conf on first start. It is written
# only for a fresh install so that re-running this role never resets the
# admin password on an existing instance.
- name: -user-seed.conf- Create file for default admin creds  # noqa: no-handler
  ansible.builtin.template:
    src: user-seed.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/user-seed.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0600'
  become: true
  no_log: true
  when: splunk_extracted is changed

- name: "-.ui_login- Touch {{ splunk_home }}/etc/.ui_login"
  ansible.builtin.file:
    path: "{{ splunk_home }}/etc/.ui_login"
    state: touch
    mode: '0644'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    access_time: preserve
    modification_time: preserve
  become: true

- name: -user-prefs.conf- Create file for default user/UI preferences
  ansible.builtin.template:
    src: user-prefs.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/user-prefs.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
  become: true
  notify: restart splunk

- name: -ui-tour.conf- Create file to disable default search tour
  ansible.builtin.template:
    src: ui-tour.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/ui-tour.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
  become: true
  notify: restart splunk

- name: -limits.conf- Set reasonable saved search limits (increased) for ES
  ansible.builtin.template:
    src: limits.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/limits.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
  become: true
  notify: restart splunk

- name: -web.conf- Create file to disable SSL and set up file for additional adds
  ansible.builtin.template:
    src: web.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/web.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0600'
    force: false
  become: true
  notify: restart splunk

- name: -web.conf- Disable auto update checking
  ansible.builtin.lineinfile:
    path: "{{ splunk_home }}/etc/system/local/web.conf"
    line: updateCheckerBaseURL = 0
    insertafter: '^\[settings\]'
  become: true
  when: not check_for_updates
  notify: restart splunk

- name: -server.conf- Specify the WiredTiger KVstore storage engine in >= 8.1
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ splunk_home }}/etc/system/local/server.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
    force: false
  become: true
  when:
    - splunk_version is version('8.1', '>=')
  notify: restart splunk

- name: Set {{ splunk_home }} owner & group recursively  # noqa: no-handler
  ansible.builtin.file:
    path: "{{ splunk_home }}"
    state: directory
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    recurse: true
  become: true
  when: splunk_extracted is changed

- name: Ensure default Splunk systemd unit file does not already exist  # noqa: no-handler
  ansible.builtin.file:
    path: /etc/systemd/system/Splunkd.service
    state: absent
  become: true
  when: splunk_extracted is changed


- name: -initd & Splunk 7.2.1 or earlier- Splunk enable boot-start
  ansible.builtin.command:
    cmd: "{{ splunk_home }}/bin/splunk enable boot-start -user {{ os_user }} --no-prompt --answer-yes --accept-license"
    creates: /etc/init.d/splunk
  become: true
  when:
    - install_method == "initd"
    - splunk_version is version('7.2.1', '<=')

- name: -initd & Splunk 7.2.2 or later- Splunk enable boot-start
  ansible.builtin.command:
    cmd: "{{ splunk_home }}/bin/splunk enable boot-start -systemd-managed 0 -user {{ os_user }} --no-prompt --answer-yes --accept-license"
    creates: /etc/init.d/splunk
  become: true
  when:
    - install_method == "initd"
    - splunk_version is version('7.2.2', '>=')


- name: -systemd & Splunk 7.2.2 to 7.2.x- Splunk enable boot-start (no systemd arguments added)
  ansible.builtin.command:
    cmd: "{{ splunk_home }}/bin/splunk enable boot-start -user {{ os_user }} --no-prompt --answer-yes --accept-license"
    creates: /etc/systemd/system/Splunkd.service
  become: true
  when:
    - install_method == "systemd"
    - splunk_version is version('7.2.2', '>=')
    - splunk_version is version('7.3', '<')

- name: -systemd & Splunk 7.3 to 8.1.0- Splunk enable boot-start (-systemd-managed 1)
  ansible.builtin.command:
    cmd: "{{ splunk_home }}/bin/splunk enable boot-start -systemd-managed 1 -user {{ os_user }} --no-prompt --answer-yes --accept-license"
    creates: /etc/systemd/system/Splunkd.service
  become: true
  when:
    - install_method == "systemd"
    - splunk_version is version('7.3', '>=')
    - splunk_version is version('8.1.1', '<')

- name: -systemd & Splunk 8.1.1 polkit- Install "polkit" for 8.1.1 or later on CentOS, RHEL, and Amazon Linux
  ansible.builtin.package:
    name: polkit
    state: present
  become: true
  when:
    - install_method == "systemd"
    - splunk_version is version('8.1.1', '>=')
    - ansible_facts['distribution'] == 'CentOS' or ansible_facts['distribution'] == 'Red Hat Enterprise Linux' or ansible_facts['distribution'] == 'Amazon'

- name: -systemd & Splunk 8.1.1 or later- Splunk enable boot-start (-systemd-managed 1) (-create-polkit-rules 1)
  ansible.builtin.command:
    cmd: >-
      {{ splunk_home }}/bin/splunk enable boot-start -systemd-managed 1
      -create-polkit-rules 1 -user {{ os_user }}
      --no-prompt --answer-yes --accept-license
    creates: /etc/systemd/system/Splunkd.service
  become: true
  when:
    - install_method == "systemd"
    - splunk_version is version('8.1.1', '>=')

- name: -systemd- Apply Splunkd.service fixes
  ansible.builtin.include_role:
    name: splunk-common
    tasks_from: systemd-unit-fixes
  when: install_method == "systemd"


# Run any pending config-change restart now, so the "is it running" checks
# below settle the service state instead of leaving a restart for later.
- name: Flush handlers before verifying that Splunk is running
  ansible.builtin.meta: flush_handlers

- name: -systemd- Ensure Splunk is running
  ansible.builtin.systemd_service:
    name: Splunkd
    state: started
    enabled: true
  become: true
  when: install_method == "systemd"

- name: -initd- Check whether Splunk is already running
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk status"
  register: splunk_status
  changed_when: false
  failed_when: false
  become: true
  when: install_method == "initd"

- name: -initd- Start Splunk
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk start --no-prompt --answer-yes --accept-license"
  become: true
  when:
    - install_method == "initd"
    - "'is running' not in splunk_status.stdout | default('')"
  changed_when: true
