---
argument_specs:

  main:
    short_description: Install the Splunk Universal Forwarder
    description:
      - Installs the Universal Forwarder from the tarball and starts it.
      - >-
        Re-running against an installed host is a no-op: the tarball is
        extracted only when $SPLUNK_HOME/bin/splunk is absent.
      - >-
        Honours uf_install_method (see splunk-common) to choose between initd
        and SplunkForwarder.service.
      - See the splunk-common role for the shared variables this role also uses.
    options:
      splunk_uf_user:
        type: str
        required: true
        description: >-
          Universal Forwarder admin username, seeded through user-seed.conf on
          first install only. Deliberately has no default - it is a credential.
      splunk_uf_pass:
        type: str
        required: true
        description: >-
          Password for splunk_uf_user, seeded on first install only.
          Deliberately has no default. Consider ansible-vault.
