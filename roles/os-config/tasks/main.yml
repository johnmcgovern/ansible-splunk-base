---

- name: Check if cloud-init exists on this system
  stat:
    path: /etc/cloud/
  register: cloud_init_exists

- name: Tell cloud-init that its job is done (preserves hostname through reboots)
  file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    access_time: preserve
    modification_time: preserve
  become: yes
  when: cloud_init_exists.stat.exists

- name: Set the hostname as per the Ansible inventory file
  hostname:
    name: "{{ inventory_hostname }}"
  become: yes


- name: Add "{{ os_group }}" group (so we can set ulimits)
  group:
    name: "{{ os_group }}"
    state: present
  become: yes

- name: Add "{{ os_user }}" user with the home dir /home/{{ os_user }}/ (so we can set ulimits)
  user:
    name: "{{ os_user }}"
    group: "{{ os_group }}"
    home: /home/{{ os_user }}/
    shell: /bin/bash
    comment: Splunk User
  become: yes


- name: -ulimits- Set /etc/security/limits.conf for "{{ os_user }}" user
  template:
    src: limits.conf.j2
    dest: "/etc/security/limits.conf"
    mode: '0644'
  become: yes


- name: -THP- Install disable-thp script to be run at boot time
  template:
    src: disable-thp.j2
    dest: "/usr/local/bin/disable-thp"
    mode: '0754'
  become: yes

- name: -THP- Install disable-thp systemd unit file
  template:
    src: disable-thp.service.j2
    dest: "/etc/systemd/system/disable-thp.service"
    mode: '0644'
  become: yes
  register: disable_thp_unit

- name: -THP- Reload the systemd daemon units after a disable-thp.service change
  systemd:
    daemon_reload: yes
  become: yes
  when: disable_thp_unit is changed

- name: -THP- Configure systemd to run disable-thp at boot time
  systemd:
    name: disable-thp
    enabled: yes
    masked: no
  become: yes

- name: -THP- Check the current transparent hugepage setting
  command: cat /sys/kernel/mm/transparent_hugepage/enabled
  register: thp_state
  changed_when: false
  failed_when: false

- name: -THP- Run the disable-thp script
  command: /usr/local/bin/disable-thp
  become: yes
  when: "'[never]' not in thp_state.stdout | default('')"


- name: -firewalld- Check if /usr/sbin/firewalld exists
  stat:
    path: /usr/sbin/firewalld
  register: firewalld_flag

- name: -firewalld-  Allow tcp/8000 traffic through firewalld
  firewalld:
    port: "8000/tcp"
    permanent: yes
    immediate: yes
    state: enabled
  become: yes
  when: firewalld_flag.stat.exists


- name: -iptables- Redirect 443 to 8000 (Ubuntu and Amazon Linux)
  iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "443"
    jump: REDIRECT
    to_ports: "8000"
  become: yes
  when: ansible_distribution == 'Ubuntu' or ansible_distribution == 'Amazon'


- name: -Ubuntu Updates- Run the equivalent of "apt-get update" as a separate step
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: -Ubuntu- Update all packages to the latest version "apt-get dist-upgrade"
  apt:
    upgrade: dist
    autoremove: yes
  become: yes
  when: ansible_distribution == "Ubuntu"


- name: -RedHat, CentOS, and Amazon Linux- Yum/DNF OS Package Updates
  package:
    name: "*"
    state: latest
  become: yes
  when: ansible_distribution == 'CentOS' or ansible_distribution == 'Red Hat Enterprise Linux' or ansible_distribution == 'Amazon'


- name: -PolicyKit- Install PolicyKit using apt-get (supported in 8.1.1)
  apt:
    name: "{{ 'polkitd' if ansible_distribution_major_version | int >= 24 else 'policykit-1' }}"
    state: present
  become: yes
  when: ansible_distribution == "Ubuntu"

- name: -PolicyKit- Install PolicyKit using yum/dnf (supported in 8.1.1)
  package:
    name: polkit
    state: present
  become: yes
  when: ansible_distribution == 'CentOS' or ansible_distribution == 'Red Hat Enterprise Linux' or ansible_distribution == 'Amazon'
