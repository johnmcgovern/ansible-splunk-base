---

- name: Check if cloud-init exists on this system
  ansible.builtin.stat:
    path: /etc/cloud/
  register: cloud_init_exists

- name: Tell cloud-init that its job is done (preserves hostname through reboots)
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    mode: '0644'
    access_time: preserve
    modification_time: preserve
  become: true
  when: cloud_init_exists.stat.exists

- name: Set the hostname as per the Ansible inventory file
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true


- name: Add "{{ os_group }}" group (so we can set ulimits)
  ansible.builtin.group:
    name: "{{ os_group }}"
    state: present
  become: true

- name: Add "{{ os_user }}" user with the home dir /home/{{ os_user }}/ (so we can set ulimits)
  ansible.builtin.user:
    name: "{{ os_user }}"
    group: "{{ os_group }}"
    home: /home/{{ os_user }}/
    shell: /bin/bash
    comment: Splunk User
  become: true


- name: -ulimits- Install limits drop-in for the "{{ os_user }}" user
  ansible.builtin.template:
    src: 99-splunk.conf.j2
    dest: /etc/security/limits.d/99-splunk.conf
    mode: '0644'
  become: true

# Earlier releases of this project replaced /etc/security/limits.conf outright.
# Drop the lines they added, so the limits are defined in exactly one place.
# Only lines in the shape this project wrote are matched; anything else in the
# file, including the distribution's own content, is left alone.
- name: -ulimits- Remove limits this project previously wrote into limits.conf
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '^@{{ os_user }}\s+(hard|soft)\s+\w+\s'
    state: absent
  become: true


- name: -THP- Install disable-thp script to be run at boot time
  ansible.builtin.template:
    src: disable-thp.j2
    dest: "/usr/local/bin/disable-thp"
    mode: '0754'
  become: true

- name: -THP- Install disable-thp systemd unit file
  ansible.builtin.template:
    src: disable-thp.service.j2
    dest: "/etc/systemd/system/disable-thp.service"
    mode: '0644'
  become: true
  register: disable_thp_unit

- name: -THP- Reload the systemd daemon units after a disable-thp.service change  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: disable_thp_unit is changed

- name: -THP- Configure systemd to run disable-thp at boot time
  ansible.builtin.systemd_service:
    name: disable-thp
    enabled: true
    masked: false
  become: true

- name: -THP- Check the current transparent hugepage setting
  ansible.builtin.command: cat /sys/kernel/mm/transparent_hugepage/enabled
  register: thp_state
  changed_when: false
  failed_when: false

- name: -THP- Run the disable-thp script
  ansible.builtin.command: /usr/local/bin/disable-thp
  become: true
  when: "'[never]' not in thp_state.stdout | default('')"
  changed_when: true


- name: -firewalld- Check if /usr/sbin/firewalld exists
  ansible.builtin.stat:
    path: /usr/sbin/firewalld
  register: firewalld_flag

- name: -firewalld-  Allow tcp/8000 traffic through firewalld
  ansible.posix.firewalld:
    port: "8000/tcp"
    permanent: true
    immediate: true
    state: enabled
  become: true
  when: firewalld_flag.stat.exists


- name: -iptables- Redirect 443 to 8000 (Ubuntu and Amazon Linux)
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    protocol: tcp
    destination_port: "443"
    jump: REDIRECT
    to_ports: "8000"
  become: true
  when: ansible_facts['distribution'] == 'Ubuntu' or ansible_facts['distribution'] == 'Amazon'


- name: -Ubuntu Updates- Run the equivalent of "apt-get update" as a separate step
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when:
    - os_update_packages | bool
    - ansible_facts['distribution'] == "Ubuntu"

- name: -Ubuntu- Update all packages to the latest version "apt-get dist-upgrade"
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
  become: true
  when:
    - os_update_packages | bool
    - ansible_facts['distribution'] == "Ubuntu"


- name: -RedHat family- Yum/DNF OS Package Updates  # noqa: package-latest
  ansible.builtin.package:
    name: "*"
    state: latest
  become: true
  when:
    - os_update_packages | bool
    - ansible_facts['os_family'] == 'RedHat'


- name: -PolicyKit- Install PolicyKit using apt-get (supported in 8.1.1)
  ansible.builtin.apt:
    name: "{{ 'polkitd' if ansible_facts['distribution_major_version'] | int >= 24 else 'policykit-1' }}"
    state: present
  become: true
  when: ansible_facts['distribution'] == "Ubuntu"

# Gather installed packages so polkit is only installed when actually missing.
# On the RedHat family polkit ships by default, and "package: state=present"
# still refreshes dnf metadata - which fails on a host with no repo access
# (air-gapped, or an unsubscribed lab box) even though nothing needs installing.
- name: -PolicyKit- Gather installed packages
  ansible.builtin.package_facts:
  when: ansible_facts['os_family'] == 'RedHat'

- name: -PolicyKit- Install PolicyKit using yum/dnf (supported in 8.1.1)
  ansible.builtin.package:
    name: polkit
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - "'polkit' not in ansible_facts.packages"
