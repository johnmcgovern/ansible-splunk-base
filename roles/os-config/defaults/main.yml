---
# Update every OS package to the latest version (apt dist-upgrade / dnf
# update) as part of os-config.
#
# Defaults to true because that is what this playbook has always done, and
# the lab-provisioning use case it was written for expects it. Set it to false
# when you want os-config to configure the OS for Splunk without also patching
# the whole host - for example when patching is managed elsewhere, or when you
# do not want an unplanned kernel upgrade on a production box.
os_update_packages: true
