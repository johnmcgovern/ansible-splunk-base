---

# Note: this archives $SPLUNK_HOME while splunkd is running, so hot buckets and
# the KV store are not guaranteed to be in a consistent state. Stop Splunk
# first if you need a restore-grade backup.
- name: Back up all of {{ splunk_home }}
  ansible.builtin.include_role:
    name: splunk-common
    tasks_from: archive
  vars:
    backup_source: "{{ splunk_home }}/"
    backup_label: full
