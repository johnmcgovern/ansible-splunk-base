---

- name: Create /home/{{ os_user }}/backups dir
  file:
    path: /home/{{ os_user }}/backups
    state: directory
    mode: '0755'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: yes

# Note: this archives $SPLUNK_HOME while splunkd is running, so hot buckets
# and the KV store are not guaranteed to be in a consistent state. Stop Splunk
# first if you need a restore-grade backup.
- name: Archive (tgz) {{ splunk_home }}/ to /home/{{ os_user }}/backups
  archive:
    path: "{{ splunk_home }}/"
    dest: "/home/{{ os_user }}/backups/splunk-full-{{ inventory_hostname }}-{{ ansible_date_time.date }}--{{ ansible_date_time.time | replace(':', '-') }}.tgz"
    format: gz
    mode: '0644'
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
  become: yes
