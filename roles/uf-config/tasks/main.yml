---

- name: -UF- Create outputs.conf for default log forwarding
  ansible.builtin.template:
    src: outputs.conf.j2
    dest: "{{ splunk_uf_home }}/etc/system/local/outputs.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
  become: true
  notify: restart splunk uf

# Equivalent to "splunk set deploy-poll <host>:<port>", but idempotent and
# without passing admin credentials on the command line (where they would be
# visible in the process list and in Ansible output).
- name: -DS- Set the deployment server name or IP
  ansible.builtin.template:
    src: deploymentclient.conf.j2
    dest: "{{ splunk_uf_home }}/etc/system/local/deploymentclient.conf"
    owner: "{{ os_user }}"
    group: "{{ os_group }}"
    mode: '0644'
  become: true
  notify: restart splunk uf
