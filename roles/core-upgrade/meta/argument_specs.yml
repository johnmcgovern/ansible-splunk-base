---
argument_specs:

  main:
    short_description: Upgrade Splunk Enterprise (Core)
    description:
      - >-
        Extracts the target release over $SPLUNK_HOME, rebuilds boot-start,
        and restarts Splunk.
      - >-
        Does nothing when etc/splunk.version already reports the target
        version, so the playbook is safe to re-run.
      - See the splunk-common role for the shared variables this role also uses.
    options:
      splunk_remove_stale_files:
        type: bool
        default: true
        description:
          - >-
            Remove files a previous release shipped that the current release
            does not - old python, mongod and library versions that extracting
            the tarball cannot clear, and which Splunk's file integrity check
            reports as "present_but_shouldnt_be".
          - >-
            Only files listed in a previous release's manifest are candidates.
            Run upgrade.yml with --check to list exactly what would go, or set
            this to false to leave them in place.
