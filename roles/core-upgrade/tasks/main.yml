---

- name: Resolve the Splunk download URL, version, and checksum
  ansible.builtin.include_role:
    name: splunk-common
    tasks_from: resolve-version

- name: Check for an existing Splunk install
  ansible.builtin.stat:
    path: "{{ splunk_home }}/etc/splunk.version"
  register: splunk_version_file_stat
  become: true

- name: Read the currently installed Splunk version
  ansible.builtin.slurp:
    src: "{{ splunk_home }}/etc/splunk.version"
  register: splunk_version_file
  become: true
  when: splunk_version_file_stat.stat.exists

- name: Record the currently installed Splunk version
  ansible.builtin.set_fact:
    splunk_installed_version: >-
      {{ (splunk_version_file.content | b64decode | regex_search('VERSION=([0-9.]+)', '\1') | first)
         if splunk_version_file_stat.stat.exists else 'none' }}

- name: Report that Splunk is already at the target version
  ansible.builtin.debug:
    msg: "Splunk {{ splunk_version }} is already installed at {{ splunk_home }} - nothing to upgrade."
  when: splunk_installed_version == splunk_version


- name: Upgrade Splunk from {{ splunk_installed_version }} to {{ splunk_version }}
  when: splunk_installed_version != splunk_version
  block:

    - name: -TGZ- Fetch the Splunk installer
      ansible.builtin.include_role:
        name: splunk-common
        tasks_from: fetch-tgz
      vars:
        splunk_fetch_tgz: "{{ splunk_tgz }}"
        splunk_fetch_url: "{{ splunk_tgz_url }}"
        splunk_fetch_checksum: "{{ splunk_tgz_checksum_resolved | default('') }}"
        splunk_fetch_download: "{{ download_tgz_from_splunk_servers }}"

    - name: Check if Splunk has ever been run via initd
      ansible.builtin.stat:
        path: /etc/init.d/splunk
      register: initd_run_flag
      become: true

    - name: Check if Splunk has ever been run via systemd
      ansible.builtin.stat:
        path: /etc/systemd/system/Splunkd.service
      register: systemd_run_flag
      become: true

    - name: -initd- Stop Splunk pre-upgrade
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk stop"
      become: true
      when: initd_run_flag.stat.exists
      changed_when: true

    - name: -systemd- Stop Splunk pre-upgrade
      ansible.builtin.systemd_service:
        name: Splunkd
        state: stopped
      become: true
      when: systemd_run_flag.stat.exists

    - name: Extract {{ splunk_tgz }} over {{ splunk_home }} to upgrade
      ansible.builtin.unarchive:
        src: /home/{{ os_user }}/{{ splunk_tgz }}
        dest: "{{ splunk_base_path }}"
        remote_src: true
        owner: "{{ os_user }}"
        group: "{{ os_group }}"
      become: true

    - name: -systemd- For initd -> systemd upgrades remove initd script
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk disable boot-start --no-prompt --answer-yes --accept-license"
      become: true
      when: install_method == "systemd"
      changed_when: true

    # No boot_start_creates: the unit is deliberately regenerated for the
    # new release, and for an initd -> systemd conversion it does not exist yet.
    - name: -systemd- Rebuild Splunk boot-start for the new release
      ansible.builtin.include_role:
        name: splunk-common
        tasks_from: boot-start-systemd
      when: install_method == "systemd"

    - name: -systemd- Apply Splunkd.service fixes
      ansible.builtin.include_role:
        name: splunk-common
        tasks_from: systemd-unit-fixes
      when: install_method == "systemd"

    - name: -initd- Start Splunk post upgrade
      ansible.builtin.command: "{{ splunk_home }}/bin/splunk start --accept-license --answer-yes"
      become: true
      when: install_method == "initd"
      changed_when: true

    - name: -systemd- Start Splunk post upgrade
      ansible.builtin.systemd_service:
        name: Splunkd
        state: started
        enabled: true
      become: true
      when: install_method == "systemd"


# Outside the version guard on purpose. An upgrade interrupted after the
# tarball is extracted leaves Splunk stopped, and every later run would skip
# the block above because the installed version already matches - so the role
# has to converge on "running", not just "installed".
- name: -systemd- Ensure Splunk is running
  ansible.builtin.systemd_service:
    name: Splunkd
    state: started
    enabled: true
  become: true
  when: install_method == "systemd"

- name: -initd- Check whether Splunk is running
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk status"
  register: splunk_final_status
  changed_when: false
  failed_when: false
  become: true
  when: install_method == "initd"

- name: -initd- Ensure Splunk is running
  ansible.builtin.command: "{{ splunk_home }}/bin/splunk start --accept-license --answer-yes"
  become: true
  when:
    - install_method == "initd"
    - "'is running' not in splunk_final_status.stdout | default('')"
  changed_when: true

# Upgrading by extracting the tgz over $SPLUNK_HOME replaces the files the new
# release ships, but leaves behind any file the new release dropped - old
# python, mongod and library versions. Splunk's own file integrity check then
# reports them as "present_but_shouldnt_be" on every startup.
#
# These tasks run outside the block above so an already-upgraded host can be
# tidied without re-running the upgrade itself.
#
# INVARIANT: the deletion list is derived FROM THE PREVIOUS RELEASE'S MANIFEST,
# never from the contents of the filesystem. A file is removed only when all
# three hold: a previous release's manifest listed it, the current release's
# manifest does not, and it is still on disk. Anything absent from both
# manifests - indexes, var/, the KV store, etc/*/local, licence state - can
# therefore never be selected. Do not invert this into "remove what is on disk
# but not in the manifest": Splunk keeps many unmanifested files it needs, and
# deleting them breaks the install.
#
# Removal is scoped to the top level of bin/ and lib/, matching what Splunk's
# integrity check reports. Run with --check first to list what would go.
- name: Remove files left behind by a previous Splunk release
  when: splunk_remove_stale_files | bool
  block:

    - name: -stale files- Find Splunk manifests in {{ splunk_home }}
      ansible.builtin.find:
        paths: "{{ splunk_home }}"
        patterns: "splunk-*-manifest"
        file_type: file
      register: splunk_manifests
      become: true

    - name: -stale files- Identify the current and superseded manifests
      ansible.builtin.set_fact:
        splunk_current_manifest: "{{ splunk_manifest_name }}"
        splunk_superseded_manifests: >-
          {{ splunk_manifests.files | map(attribute='path')
             | reject('equalto', splunk_manifest_name) | list }}
      vars:
        splunk_manifest_name: "{{ splunk_home }}/{{ splunk_tgz | regex_replace('\\.tgz$', '') }}-manifest"

    - name: Clean up against the superseded manifests
      when: splunk_superseded_manifests | length > 0
      block:

        - name: -stale files- List files the previous release shipped and this one does not
          ansible.builtin.shell:
            # LC_ALL=C matters: comm compares byte-wise and silently emits
            # garbage if sort used a locale-dependent collation.
            cmd: |
              set -o pipefail
              export LC_ALL=C
              work=$(mktemp -d)
              trap 'rm -rf "$work"' EXIT
              paths() { awk '$1 == "f" || $1 == "l" {print $5}' "$@"; }
              paths {{ splunk_current_manifest | quote }} | sort -u > "$work/current"
              paths {{ splunk_superseded_manifests | map('quote') | join(' ') }} | sort -u > "$work/previous"
              comm -23 "$work/previous" "$work/current" > "$work/dropped"
              # Scoped to the top level of bin/ and lib/, which is what Splunk's
              # own integrity check reports. Stale files do exist deeper in the
              # tree (bin/jars, lib/python3.x, retired apps); widen this pattern
              # to reclaim those too, at the cost of a much larger deletion.
              grep -E '^[^/]+/(bin|lib)/[^/]+$' "$work/dropped" > "$work/scoped" || true
              while read -r relative; do
                  path="{{ splunk_home }}/${relative#*/}"
                  if [ -e "$path" ] || [ -L "$path" ]; then
                      printf '%s\n' "$path"
                  fi
              done < "$work/scoped"
            executable: /bin/bash
          register: splunk_stale_files
          changed_when: false
          # Read-only, so run it under --check too - otherwise a dry run cannot
          # show which files would be removed.
          check_mode: false
          become: true

        - name: -stale files- Report how many files will be removed
          ansible.builtin.debug:
            msg: >-
              {{ splunk_stale_files.stdout_lines | length }} file(s) shipped by a
              previous Splunk release will be removed from {{ splunk_home }}.

        # Removed in bulk rather than with a file/state=absent loop: there are
        # typically thousands of them and a per-file task takes many minutes.
        - name: -stale files- Remove them
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              printf '%s\n' {{ splunk_stale_files.stdout_lines | map('quote') | join(' ') }} |
                  xargs -r -d '\n' rm -f --
            executable: /bin/bash
          become: true
          when: splunk_stale_files.stdout_lines | length > 0
          changed_when: true
          notify: restart splunk

        # Fail loudly rather than leaving a damaged install behind: this is
        # Splunk's own check that every file the current manifest requires is
        # present and unmodified.
        - name: -stale files- Verify the install still matches the current manifest
          ansible.builtin.command: "{{ splunk_home }}/bin/splunk validate files"
          register: splunk_validate_files
          changed_when: false
          failed_when: "'All installed files intact' not in splunk_validate_files.stdout"
          become: true
          when: splunk_stale_files.stdout_lines | length > 0

        - name: -stale files- Remove the superseded manifests themselves
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          become: true
          loop: "{{ splunk_superseded_manifests }}"
          notify: restart splunk
