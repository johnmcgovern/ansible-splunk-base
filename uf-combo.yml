---
# This playbook installs AND configures the Splunk UF.
# Note: This works differently from regular combo.yml.
#   We do not automatically run os-config.yml for a UF OS
#   but it certainly can be run manually if needed.
#
# Composed from the individual playbooks rather than repeating their plays, so
# the two cannot drift apart. The prereqs play therefore runs twice, which is
# harmless - it is a no-op on any distribution that already ships python3.

- name: Install Splunk Universal Forwarder
  ansible.builtin.import_playbook: uf-install.yml

- name: Configure Splunk Universal Forwarder
  ansible.builtin.import_playbook: uf-config.yml
