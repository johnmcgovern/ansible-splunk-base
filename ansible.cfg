[defaults]
# Default inventory, so "-i hosts" is optional.
inventory = hosts
roles_path = ./roles

# Do not warn about which python3 the target discovered - all currently
# supported targets ship one.
interpreter_python = auto_silent

# Keep output readable when a task fails. (The old "stdout_callback = yaml"
# plugin was removed in community.general 12; this is its replacement.)
callback_result_format = yaml
display_skipped_hosts = false

[ssh_connection]
# Fewer SSH round trips per task. Requires "requiretty" to be disabled in
# sudoers on the target, which is the default on modern distributions.
pipelining = true
