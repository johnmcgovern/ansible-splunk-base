---
# This playbook:
#  1) Performs a basic OS configuration for lab hosts.
#  2) Installs a base image of Splunk Enterprise.
#
# Composed from the individual playbooks rather than repeating their plays, so
# the two cannot drift apart. The prereqs play therefore runs twice, which is
# harmless - it is a no-op on any distribution that already ships python3.

- name: Basic OS Configuration & Updates
  ansible.builtin.import_playbook: os-config.yml

- name: Install Splunk
  ansible.builtin.import_playbook: install.yml
