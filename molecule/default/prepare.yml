---
# os-config's 443-to-8000 redirect uses iptables on Ubuntu and Amazon Linux,
# which the base images do not ship. Install it here so the redirect task runs
# for real (and is checked for idempotence) rather than being skipped. The
# condition mirrors the role's own: the redirect is Ubuntu/Amazon only.
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Refresh the apt cache so iptables is installable (Debian family)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install iptables so the redirect task can run inside the container
      ansible.builtin.package:
        name: iptables
        state: present
      when: ansible_facts['distribution'] in ['Ubuntu', 'Amazon']
